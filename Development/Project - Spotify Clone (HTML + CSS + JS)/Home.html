<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="Styling/basic.css" />
    <link rel="stylesheet" href="Styling/utility.css" />
    <link rel="stylesheet" href="Styling/nav.css" />
    <link rel="stylesheet" href="Styling/leftSection.css" />
    <link rel="stylesheet" href="Styling/rightSection.css" />
    <link rel="stylesheet" href="Styling/seekbar.css" />
    <link rel="stylesheet" href="Styling/media.css">
  </head>
  <body>
    <nav>
      <div class="leftNav">
        <a href="#spotify">
          <img class="invert icon-mid" src="Assets/logo.svg" alt="Spotify" />
        </a>
        <div class="homeNsearch">
          <a href="#home">
            <button class="button svgContainer hover" id="home">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                data-encore-id="icon"
                role="img"
                aria-hidden="true"
                class="e-10451-icon"
                viewBox="0 0 24 24"
                style="
                  --encore-icon-height: var(
                    --encore-graphic-size-decorative-base
                  );
                  --encore-icon-width: var(
                    --encore-graphic-size-decorative-base
                  );
                "
              >
                <path
                  d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732z"
                ></path>
              </svg>
            </button>
          </a>
          <div class="searchBar">
            <input type="text" />
            <div class="buttons">
              <button class="button svgContainer hover" id="search">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  data-encore-id="icon"
                  role="img"
                  aria-hidden="true"
                  class="e-10451-icon"
                  viewBox="0 0 24 24"
                  style="
                    --encore-icon-height: var(
                      --encore-graphic-size-decorative-base
                    );
                    --encore-icon-width: var(
                      --encore-graphic-size-decorative-base
                    );
                  "
                >
                  <path
                    d="M10.533 1.27893C5.35215 1.27893 1.12598 5.41887 1.12598 10.5579C1.12598 15.697 5.35215 19.8369 10.533 19.8369C12.767 19.8369 14.8235 19.0671 16.4402 17.7794L20.7929 22.132C21.1834 22.5226 21.8166 22.5226 22.2071 22.132C22.5976 21.7415 22.5976 21.1083 22.2071 20.7178L17.8634 16.3741C19.1616 14.7849 19.94 12.7634 19.94 10.5579C19.94 5.41887 15.7138 1.27893 10.533 1.27893ZM3.12598 10.5579C3.12598 6.55226 6.42768 3.27893 10.533 3.27893C14.6383 3.27893 17.94 6.55226 17.94 10.5579C17.94 14.5636 14.6383 17.8369 10.533 17.8369C6.42768 17.8369 3.12598 14.5636 3.12598 10.5579Z"
                  ></path>
                </svg>
              </button>
              <button class="button svgContainer hover" id="browse">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  data-encore-id="icon"
                  role="img"
                  aria-hidden="true"
                  class="e-10451-icon"
                  viewBox="0 0 24 24"
                  style="
                    --encore-icon-height: var(
                      --encore-graphic-size-decorative-base
                    );
                    --encore-icon-width: var(
                      --encore-graphic-size-decorative-base
                    );
                  "
                >
                  <path
                    d="M15 15.5c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2"
                  ></path>
                  <path
                    d="M1.513 9.37A1 1 0 0 1 2.291 9h19.418a1 1 0 0 1 .979 1.208l-2.339 11a1 1 0 0 1-.978.792H4.63a1 1 0 0 1-.978-.792l-2.339-11a1 1 0 0 1 .201-.837zM3.525 11l1.913 9h13.123l1.913-9zM4 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v4h-2V3H6v3H4z"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="rightNav">
        <div class="appInstall svgContainer hover">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            data-encore-id="icon"
            role="img"
            aria-hidden="true"
            class="e-10451-icon"
            viewBox="0 0 16 16"
            style="
              --encore-icon-height: var(
                --encore-graphic-size-decorative-smaller
              );
              --encore-icon-width: var(
                --encore-graphic-size-decorative-smaller
              );
            "
          >
            <path
              d="M4.995 8.745a.75.75 0 0 1 1.06 0L7.25 9.939V4a.75.75 0 0 1 1.5 0v5.94l1.195-1.195a.75.75 0 1 1 1.06 1.06L8 12.811l-.528-.528-.005-.005-2.472-2.473a.75.75 0 0 1 0-1.06"
            ></path>
            <path
              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13"
            ></path>
          </svg>
          <p>Install App</p>
        </div>
        <div class="signUpLogin">
          <a href="#signup" class="hover">Sign Up</a>
          <button class="button hover">Log In</button>
        </div>
      </div>
    </nav>
    <div class="navBottom">
      <div class="left">
        <div class="leftTop">
          <h4>Your Library</h4>
          <div class="musicWindow"></div>
        </div>
        <div class="leftBottom">
          <div class="links">
            <a href="#legal">Legal</a
            ><a href="#safety">Safety & Privacy Center</a
            ><a href="#policy">Privacy Policy</a><a href="#cookies">Cookies</a
            ><a href="#ads">About Ads</a
            ><a href="#accessibility">Accessibility</a>
          </div>
          <a href="#cookies">Cookies</a>
          <div class="languageButton hover">
            <div class="svgContainer">
              <svg
                data-encore-id="icon"
                role="img"
                aria-hidden="true"
                class="e-10451-icon"
                viewBox="0 0 16 16"
                style="
                  --encore-icon-height: var(
                    --encore-graphic-size-decorative-smaller
                  );
                  --encore-icon-width: var(
                    --encore-graphic-size-decorative-smaller
                  );
                "
              >
                <path
                  d="M8.152 16H8a8 8 0 1 1 .152 0m-.41-14.202c-.226.273-.463.713-.677 1.323-.369 1.055-.626 2.496-.687 4.129h3.547c-.06-1.633-.318-3.074-.687-4.129-.213-.61-.45-1.05-.676-1.323-.194-.235-.326-.285-.385-.296h-.044c-.055.007-.19.052-.391.296M4.877 7.25c.062-1.771.34-3.386.773-4.624q.148-.427.329-.806a6.51 6.51 0 0 0-4.436 5.43zm-3.334 1.5a6.51 6.51 0 0 0 4.436 5.43 8 8 0 0 1-.33-.806c-.433-1.238-.71-2.853-.772-4.624zm4.835 0c.061 1.633.318 3.074.687 4.129.214.61.451 1.05.677 1.323.202.244.336.29.391.297l.044-.001c.06-.01.19-.061.385-.296.226-.273.463-.713.676-1.323.37-1.055.626-2.496.687-4.129zm5.048 0c-.061 1.771-.339 3.386-.772 4.624q-.123.353-.268.674a6.5 6.5 0 0 0 4.071-5.298zm3.031-1.5a6.51 6.51 0 0 0-4.071-5.298q.145.322.268.674c.433 1.238.711 2.853.772 4.624z"
                ></path>
              </svg>
            </div>
            <p>Language</p>
          </div>
        </div>
      </div>
      <div class="right">
        <section>
          <h1>My Playlists</h1>
          <div class="playlistsContainer"></div>
        </section>
       
      </div>
       <div class="seekbarWrapper">
            <footer class="player">
              <div class="info">
                <div class="imgContainer">
                  <img id="currentImage" src="" alt="" />
                </div>
                <div class="textContainer">
                  <p id="currentTitle" class="title">Music Name</p>
                  <!-- <p id="currentArtist" class="artist">Artist Name</p> -->
                </div>
              </div>
              <div class="playerControls">
                <div class="playerButtons svgContainer">
                  <svg
                    id="previous"
                    data-encore-id="icon"
                    role="img"
                    aria-hidden="true"
                    class="e-10451-icon"
                    viewBox="0 0 16 16"
                    style="
                      --encore-icon-height: var(
                        --encore-graphic-size-decorative-smaller
                      );
                      --encore-icon-width: var(
                        --encore-graphic-size-decorative-smaller
                      );
                    "
                  >
                    <path
                      d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7z"
                    ></path>
                  </svg>
                  <div class="playWrapper">
                    <svg
                      data-encore-id="icon"
                      role="img"
                      aria-hidden="true"
                      class="e-10451-icon"
                      viewBox="0 0 24 24"
                      style="
                        --encore-icon-height: var(
                          --encore-graphic-size-decorative-base
                        );
                        --encore-icon-width: var(
                          --encore-graphic-size-decorative-base
                        );
                      "
                    >
                      <path
                        d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606"
                      ></path>
                    </svg>
                  </div>
                  <svg
                    id="next"
                    data-encore-id="icon"
                    role="img"
                    aria-hidden="true"
                    class="e-10451-icon"
                    viewBox="0 0 16 16"
                    style="
                      --encore-icon-height: var(
                        --encore-graphic-size-decorative-smaller
                      );
                      --encore-icon-width: var(
                        --encore-graphic-size-decorative-smaller
                      );
                    "
                  >
                    <path
                      d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"
                    ></path>
                  </svg>
                </div>
                <div class="timeline">
                  <span id="elapsed">0:00</span>
                  <div class="progressWrapper">
                    <div class="progressFilled hover"></div>
                  </div>
                  <span id="total">3:45</span>
                </div>
              </div>
              <div class="volumeControls">
                <div id="volume" class="icon hover">
                  <div id="mute"></div>
                  <svg
                    data-encore-id="icon"
                    role="presentation"
                    aria-label="Volume high"
                    aria-hidden="false"
                    class="e-10451-icon"
                    id="volume-icon"
                    viewBox="0 0 16 16"
                    style="
                      --encore-icon-height: var(
                        --encore-graphic-size-informative-smaller
                      );
                      --encore-icon-width: var(
                        --encore-graphic-size-informative-smaller
                      );
                    "
                  >
                    <path
                      d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.64 3.64 0 0 1-1.33-4.967 3.64 3.64 0 0 1 1.33-1.332l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.14 2.14 0 0 0 0 3.7l5.8 3.35V2.8zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88"
                    ></path>
                    <path
                      d="M11.5 13.614a5.752 5.752 0 0 0 0-11.228v1.55a4.252 4.252 0 0 1 0 8.127z"
                    ></path>
                  </svg>
                </div>
                <div class="volumeWrapper">
                  <div class="volumeFilled"></div>
                </div>
              </div>
            </footer>
          </div>
    </div>
    <script src="Scripts/script.js"></script>
    <script src="Scripts/functions.js"></script>
  </body>
</html>
